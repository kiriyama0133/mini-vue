const app = document.getElementById('app')
const Child = {
    setup(props, { slots }) {
      return () => {
        return h({
          type: Teleport,
          props: {
            to: '#app2'
          },
          children: [
            h({
                type: Text,
                children: 'hello'
            })
          ]
        })
      }
    }
  }
const Parent = {
    setup(){
        const count = ref(1)
        const double = computed(() => count.value * 2)
        function increment() {
            count.value ++
        }
        return {
            count,
            double,
            increment
        }
    },
    render(proxy) {
        return h({
            type: Child,
            props: {
                count: this.count,
                increment: this.increment,
                style: {
                    color: 'red'
                }
            }
        })
    }
}

render(
    h({
        type: Parent
    }),
